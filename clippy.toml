# Test-only escapes for the no-panic lints in Cargo.toml [workspace.lints.clippy].
# No escape exists for todo!/unimplemented!/unreachable!/panic_in_result_fn/manual_assert.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = true
# arithmetic-side-effects-allowed = []  # paths are crate-internal, e.g. "geo::Px" (not "Px", not "mycrate::geo::Px")
# Product names that doc_markdown would otherwise demand backticks for; ".." keeps the defaults.
doc-valid-idents = ["OpenAI", "DeepSeek", "LM Studio", ".."]
