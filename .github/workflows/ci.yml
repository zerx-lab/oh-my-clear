# Gates on all three desktop platforms (ADR 0008). Mirrors `cargo ci`:
# xtask layers → fmt → clippy → nextest → deny.
name: ci

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  gates:
    name: gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny

      - uses: Swatinem/rust-cache@v2

      - name: layers
        run: cargo xtask layers

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: nextest
        run: cargo nextest run --workspace --all-features --locked --profile ci

      - name: deny
        if: matrix.os == 'ubuntu-latest'
        run: cargo deny --all-features check

      - name: junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
