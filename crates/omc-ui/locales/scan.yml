_version: 2
scan:
  restarted:
    en: The cleaning service restarted, so the scan was lost. Scan again.
    zh-CN: 清理服务已重启，扫描结果已丢失，请重新扫描。
  disconnected:
    title:
      en: Not connected to the cleaning service
      zh-CN: 未连接到清理服务
    body:
      en: oh-my-clear is starting or reconnecting to its background service. Scans become available once it answers.
      zh-CN: oh-my-clear 正在启动或重新连接后台服务，连接后即可扫描。
  error:
    en: Something went wrong
    zh-CN: 出错了
  dismiss:
    en: Dismiss
    zh-CN: 关闭
  cancel:
    en: Cancel
    zh-CN: 取消
  scan:
    en: Scan
    zh-CN: 扫描
  rescan:
    en: Scan again
    zh-CN: 重新扫描
  progress:
    counted:
      en: "%{done} of %{total} · %{bytes}"
      zh-CN: "%{done} / %{total} · %{bytes}"
    found:
      en: "%{items} items checked · %{bytes} found"
      zh-CN: "已检查 %{items} 项 · 发现 %{bytes}"
    freed:
      en: "%{bytes} freed"
      zh-CN: "已释放 %{bytes}"
    freed_of:
      en: "%{bytes} of %{total} freed"
      zh-CN: "已释放 %{bytes} / %{total}"
    items_of:
      en: "%{done} of %{total} items"
      zh-CN: "%{done} / %{total} 项"
  phase:
    starting:
      en: Starting…
      zh-CN: 正在准备…
    scanning:
      en: Scanning…
      zh-CN: 正在扫描…
    measuring:
      en: Measuring sizes…
      zh-CN: 正在计算大小…
    hashing:
      en: Comparing contents…
      zh-CN: 正在比较内容…
    quitting:
      en: Waiting for the app to quit…
      zh-CN: 正在等待应用退出…
    uninstalling:
      en: Running the uninstaller…
      zh-CN: 正在运行卸载程序…
    elevating:
      en: Waiting for administrator approval…
      zh-CN: 正在等待管理员授权…
    removing:
      en: Removing…
      zh-CN: 正在删除…
    finishing:
      en: Finishing…
      zh-CN: 正在完成…
  select_all:
    en: All
    zh-CN: 全选
  select_none:
    en: None
    zh-CN: 全不选
  truncated:
    en: Only the largest results are listed.
    zh-CN: 仅列出最大的结果。
clean:
  confirm:
    title:
      en: "Remove %{count} items (%{bytes})?"
      zh-CN: "删除 %{count} 项（%{bytes}）？"
    method_junk:
      en: Items are removed the way your settings choose for junk (permanently by default). Apps recreate caches and logs as needed.
      zh-CN: 将按设置中对垃圾文件的删除方式处理（默认永久删除）。应用会在需要时重新生成缓存和日志。
    method_files:
      en: Files are removed the way your settings choose for your own files (moved to the Trash by default).
      zh-CN: 将按设置中对个人文件的删除方式处理（默认移到废纸篓）。
    permanent:
      en: They are deleted permanently and cannot be restored.
      zh-CN: 它们将被永久删除，无法恢复。
    trash:
      en: They are moved to the Trash, so you can restore them until you empty it.
      zh-CN: 它们将被移到废纸篓，清空废纸篓之前都可以恢复。
    ok:
      en: Remove
      zh-CN: 删除
    cancel:
      en: Cancel
      zh-CN: 取消
  done:
    title:
      en: "Freed %{bytes}"
      zh-CN: "已释放 %{bytes}"
    body:
      en: "%{removed} items removed, %{failed} could not be removed."
      zh-CN: "已删除 %{removed} 项，%{failed} 项无法删除。"
  back:
    en: Back to results
    zh-CN: 返回结果
  stat:
    freed:
      en: Freed
      zh-CN: 已释放
    removed:
      en: Removed
      zh-CN: 已删除
    failed:
      en: Not removed
      zh-CN: 未删除
  more:
    en: "and %{n} more"
    zh-CN: "以及另外 %{n} 项"
  reason:
    permission_denied:
      en: Needs administrator rights
      zh-CN: 需要管理员权限
    full_disk_access:
      en: Needs Full Disk Access
      zh-CN: 需要“完全磁盘访问权限”
    app_management:
      en: Needs App Management
      zh-CN: 需要“App 管理”权限
    in_use:
      en: In use
      zh-CN: 正在使用
    protected:
      en: Protected
      zh-CN: 受保护
    elevation_cancelled:
      en: Administrator prompt cancelled
      zh-CN: 已取消管理员授权
    trash_unavailable:
      en: Trash unavailable
      zh-CN: 废纸篓不可用
    other:
      en: Other errors
      zh-CN: 其他错误
  hint:
    permission_denied:
      en: Turn on administrator prompts in Settings to remove these, or remove them yourself.
      zh-CN: 在设置中开启管理员授权提示后即可删除，或手动删除。
    full_disk_access:
      en: Give oh-my-clear Full Disk Access in System Settings › Privacy & Security, then scan again.
      zh-CN: 请在“系统设置 › 隐私与安全性”中为 oh-my-clear 开启“完全磁盘访问权限”，然后重新扫描。
    app_management:
      en: Allow oh-my-clear to manage apps in System Settings › Privacy & Security › App Management.
      zh-CN: 请在“系统设置 › 隐私与安全性 › App 管理”中允许 oh-my-clear。
    in_use:
      en: A running program holds these files. Quit it and try again.
      zh-CN: 有程序正在使用这些文件，请退出该程序后重试。
    protected:
      en: System locations and your exclusions are never removed.
      zh-CN: 系统位置和你排除的路径永远不会被删除。
    elevation_cancelled:
      en: The administrator prompt was dismissed. Clean again to retry.
      zh-CN: 管理员授权窗口被关闭，请重新清理以重试。
    trash_unavailable:
      en: This volume has no Trash. Choose permanent deletion for user files in Settings to remove them.
      zh-CN: 该磁盘没有废纸篓。可在设置中将个人文件改为永久删除。
    other:
      en: The system refused for another reason; details are in the log.
      zh-CN: 系统因其他原因拒绝了操作，详情见日志。
perm:
  fda:
    title:
      en: Full Disk Access is off
      zh-CN: 未开启“完全磁盘访问权限”
    body:
      en: Without it, macOS hides caches, logs and mail data of other apps from the scan. Grant it to oh-my-clear in System Settings › Privacy & Security.
      zh-CN: 没有该权限时，macOS 会对扫描隐藏其他应用的缓存、日志和邮件数据。请在“系统设置 › 隐私与安全性”中为 oh-my-clear 开启。
  open_full_disk_access:
    en: Open Privacy Settings
    zh-CN: 打开隐私设置
  open_app_management:
    en: Open App Management
    zh-CN: 打开“App 管理”
  denied:
    title:
      en: Some places could not be scanned
      zh-CN: 部分位置无法扫描
    body:
      en: "%{count} locations were not readable (e.g. %{path})."
      zh-CN: "有 %{count} 个位置无法读取（例如 %{path}）。"
