      zh-CN: 控件和浮层下方的投影。
  focus_ring:
    title:
      en: Focus ring
      zh-CN: 焦点环
    description:
      en: Outline around the focused control. When off, only its border is tinted.
      zh-CN: 聚焦控件外侧的描边。关闭后只保留边框着色。
  dividers:
