nav:
  settings:
    en: Settings
    zh-CN: 设置
  toggle_sidebar:
    en: Toggle Sidebar
    zh-CN: 显示/隐藏侧边栏
  group:
    cleanup:
      en: Cleanup
      zh-CN: 清理
    storage:
      en: Storage
      zh-CN: 空间
    applications:
      en: Applications
      zh-CN: 应用
    automation:
      en: Automation
      zh-CN: 自动化
  overview:
    title:
      en: Overview
      zh-CN: 概览
  system_junk:
    title:
      en: System Junk
      zh-CN: 系统垃圾
    description:
      en: Files the system and your apps regenerate on their own and no longer need.
      zh-CN: 系统和应用会自行重建、已不再需要的文件。
    covers:
      en: User and system caches, logs, crash reports, temporary files, leftover update files.
      zh-CN: 用户与系统缓存、日志、崩溃报告、临时文件、更新残留。
  browser_data:
    title:
      en: Browser Data
      zh-CN: 浏览器数据
    description:
      en: What browsers keep about the sites you visit.
      zh-CN: 浏览器为访问过的网站保存的数据。
    covers:
      en: Caches, cookies, history, downloads list and site storage of Safari, Chrome, Edge and Firefox.
      zh-CN: Safari、Chrome、Edge 与 Firefox 的缓存、Cookie、历史记录、下载记录和网站存储。
  developer_junk:
    title:
      en: Developer Junk
      zh-CN: 开发者垃圾
    description:
      en: Build output and downloaded packages a project can rebuild or fetch again.
      zh-CN: 项目可以重新构建或重新下载的构建产物与依赖包。
    covers:
      en: node_modules, target, build, DerivedData, simulator caches, npm / pnpm / Cargo / Gradle / pip caches, unused container images.
      zh-CN: node_modules、target、build、DerivedData、模拟器缓存，npm / pnpm / Cargo / Gradle / pip 缓存，未使用的容器镜像。
  trash:
    title_macos:
      en: Trash
      zh-CN: 废纸篓
    title_windows:
      en: Recycle Bin
      zh-CN: 回收站
    title_linux:
      en: Trash
      zh-CN: 回收站
    description:
      en: Deleted items that still take up space until they are emptied.
      zh-CN: 已删除但在清空前仍占用空间的项目。
    covers:
      en: The deleted-items folder of every drive, including external ones.
      zh-CN: 每个磁盘（包括外接磁盘）上的已删除项目。
  space_lens:
    title:
      en: Space Lens
      zh-CN: 空间透镜
    description:
      en: A map of what fills a disk, folder by folder.
      zh-CN: 按文件夹逐层查看磁盘被什么占满。
    covers:
      en: Any drive or folder, sized and sorted so the biggest items come first.
      zh-CN: 任意磁盘或文件夹，按大小排序，最大的排在最前。
  large_old_files:
    title:
      en: Large & Old Files
      zh-CN: 大文件与旧文件
    description:
      en: Files that take the most space or have not been opened in a long time.
      zh-CN: 占用空间最多，或很久没有打开过的文件。
    covers:
      en: Files over a size threshold or untouched for months, grouped by kind and age.
      zh-CN: 超过大小阈值或数月未访问的文件，按类型和时间分组。
  duplicates:
    title:
      en: Duplicates
      zh-CN: 重复文件
    description:
      en: Identical copies of the same file in different places.
      zh-CN: 同一文件在不同位置的相同副本。
    covers:
      en: Files with identical content, matched by size and then by hash, regardless of name.
      zh-CN: 内容完全相同的文件：先按大小、再按哈希比对，与文件名无关。
  uninstaller:
    title:
      en: Uninstaller
      zh-CN: 卸载程序
    description:
      en: Remove an app together with everything it created.
      zh-CN: 连同应用生成的所有文件一起移除。
    covers:
      en: The app itself plus its caches, preferences, support files, logs and login items.
      zh-CN: 应用本体及其缓存、偏好设置、支持文件、日志和登录项。
  leftovers:
    title:
      en: Leftovers
      zh-CN: 应用残留
    description:
      en: Files left behind by apps that are no longer installed.
      zh-CN: 已卸载应用遗留下来的文件。
    covers:
      en: Orphaned support folders, caches, preferences and containers without an owning app.
      zh-CN: 找不到所属应用的支持文件夹、缓存、偏好设置和容器。
  installers:
    title:
      en: Installers
      zh-CN: 安装包
    description:
      en: Installer packages that already did their job.
      zh-CN: 已完成安装任务的安装包。
    covers:
      en: .dmg, .pkg, .msi, .exe setup, .deb, .rpm and .AppImage files in Downloads and elsewhere.
      zh-CN: “下载”等位置中的 .dmg、.pkg、.msi、.exe 安装程序、.deb、.rpm 和 .AppImage 文件。
  startup_items:
    title:
      en: Startup Items
      zh-CN: 启动项
    description:
      en: Programs and services that start with your session.
      zh-CN: 随登录一起启动的程序和服务。
    covers:
      en: Login items, launch agents and daemons, Windows startup entries and services, XDG autostart and systemd user units.
      zh-CN: 登录项、启动代理与守护进程、Windows 启动项与服务、XDG 自启动项与 systemd 用户单元。
  rules:
    title:
      en: Rules
      zh-CN: 规则
    description:
      en: Cleanups that run on their own on a schedule, so you do not have to remember them.
      zh-CN: 按计划自动执行的清理，无需你记着去做。
    covers:
      en: When to run, what to look at, which items qualify, and whether to ask first.
      zh-CN: 何时运行、检查什么、哪些项目符合条件，以及是否先询问你。
  activity:
    title:
      en: Activity
      zh-CN: 活动
    description:
      en: What your rules found and did, and the runs waiting for your answer.
      zh-CN: 规则发现并处理了什么，以及等待你答复的运行。
    covers:
      en: Pending decisions, past runs, freed space and the items each run acted on.
      zh-CN: 待决定的运行、历史运行、释放的空间以及每次运行处理的项目。
