    en: "Used %{age}"
    zh-CN: "上次使用：%{age}"
  installed_ago:
    en: "Installed %{age}"
    zh-CN: "安装于：%{age}"
  pick:
    title:
      en: Select an app
      zh-CN: 选择一个应用
    body:
      en: Choose an app on the left to see everything that belongs to it.
      zh-CN: 在左侧选择一个应用，查看属于它的所有内容。
  batch_body:
    en: Each app is removed with its related items at the confidence set in Settings.
    zh-CN: 每个应用会连同设置中所选可信度及以上的相关项目一并删除。
uninstall:
  button:
    en: Uninstall
    zh-CN: 卸载
  close:
    en: Close
    zh-CN: 关闭
  uninstaller:
    en: App's own uninstaller
    zh-CN: 应用自带的卸载程序
  no_uninstaller:
    en: This app has no uninstaller of its own; its files are removed directly.
    zh-CN: 该应用没有自带的卸载程序，将直接删除其文件。
  totals:
    en: "%{selected} of %{all} items selected · %{bytes}"
    zh-CN: "已选择 %{selected}/%{all} 项 · %{bytes}"
  review_hint:
    en: Items with lower confidence were found by name only and may belong to something else — check them before selecting.
    zh-CN: 可信度较低的项目仅按名称找到，可能属于其他软件——勾选前请检查。
  confirm:
    title_one:
      en: "Uninstall %{name}?"
      zh-CN: "卸载 %{name}？"
    title_many:
      en: "Uninstall %{n} apps?"
      zh-CN: "卸载 %{n} 个应用？"
    body_one:
      en: "%{count} items (%{bytes}) will be removed."
      zh-CN: "将删除 %{count} 项（%{bytes}）。"
    body_many:
      en: "For each app, related items at %{level} confidence or higher are removed."
      zh-CN: "对每个应用，将删除可信度为“%{level}”及以上的相关项目。"
    more:
      en: "and %{n} more"
      zh-CN: "以及另外 %{n} 个"
    run_uninstaller:
      en: Run the app's own uninstaller first
      zh-CN: 先运行应用自带的卸载程序
    quit:
      en: Running apps are quit first; unsaved work in them is lost.
      zh-CN: 正在运行的应用会先被退出，其中未保存的内容会丢失。
    admin:
      en: You may be asked for an administrator password.
      zh-CN: 可能会要求你输入管理员密码。
    trash:
      en: Files are moved to the Trash.
      zh-CN: 文件将被移到废纸篓。
    permanent:
      en: Files are deleted permanently.
      zh-CN: 文件将被永久删除。
    ok:
      en: Uninstall
      zh-CN: 卸载
    cancel:
      en: Cancel
      zh-CN: 取消
  phase:
    finding:
      en: Finding related files…
      zh-CN: 正在查找相关文件……
    starting:
      en: Preparing…
      zh-CN: 正在准备……
    quitting:
      en: Quitting the app…
      zh-CN: 正在退出应用……
    uninstalling:
      en: The app's uninstaller is running. Follow the uninstaller's window.
      zh-CN: 应用自带的卸载程序正在运行，请按照卸载程序窗口的提示操作。
    elevating:
      en: Approve the administrator prompt to continue.
      zh-CN: 请在管理员授权提示中确认以继续。
    removing:
      en: Removing files…
      zh-CN: 正在删除文件……
  status:
    pending:
      en: Waiting
      zh-CN: 等待中
    finding:
      en: Finding files
      zh-CN: 正在查找文件
    running:
      en: Uninstalling
      zh-CN: 正在卸载
    done:
      en: Removed
      zh-CN: 已移除
    failed:
      en: Failed
      zh-CN: 失败
  outcome:
    not_run:
      en: The app's own uninstaller did not run.
      zh-CN: 应用自带的卸载程序未运行。
    succeeded:
      en: The app's own uninstaller finished.
      zh-CN: 应用自带的卸载程序已完成。
    failed:
      en: "The app's own uninstaller failed: %{detail}. Its files were still removed as selected."
      zh-CN: "应用自带的卸载程序失败：%{detail}。已按所选内容删除其文件。"
    cancelled:
      en: The app's own uninstaller was cancelled.
      zh-CN: 应用自带的卸载程序已取消。
  running_title:
    en: "Uninstalling %{name}"
    zh-CN: "正在卸载 %{name}"
  batch_title:
    en: "Uninstalling apps · %{done} of %{n} done"
    zh-CN: "正在卸载应用 · 已完成 %{done}/%{n}"
  finished_title:
    en: Uninstall finished
    zh-CN: 卸载完成
  leftovers_hint:
    en: Some apps leave files in places only a full scan finds. Run a scan in Leftovers to catch them.
    zh-CN: 部分应用会在只有完整扫描才能发现的位置留下文件。请在“残留文件”中扫描以找出它们。
  restarted:
    en: The oh-my-clear service restarted during the uninstall. Refresh the list to see what is left.
    zh-CN: 卸载过程中 oh-my-clear 后台服务重新启动了。请刷新列表查看剩余内容。
  batch:
    en: "Uninstall %{n} selected"
    zh-CN: "卸载所选 %{n} 个"
  selected_size:
    en: Selected
    zh-CN: 已选
  step:
    quit:
      en: Quit the app
      zh-CN: 退出应用
    uninstaller:
      en: Run its own uninstaller
      zh-CN: 运行自带的卸载程序
    admin:
      en: Administrator approval
      zh-CN: 管理员授权
    remove:
      en: Remove files
      zh-CN: 删除文件
