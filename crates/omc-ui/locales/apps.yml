    en: "%{n} apps selected"
    zh-CN: "已选择 %{n} 个应用"
  clear_selection:
    en: Clear selection
    zh-CN: 清除选择
  system_locked:
    en: System apps are part of the operating system and can't be uninstalled.
    zh-CN: 系统应用是操作系统的一部分，无法卸载。
  select:
    en: Select for batch uninstall
    zh-CN: 选择以批量卸载
  load:
    en: Load apps
    zh-CN: 加载应用列表
