    next:
      en: Next run
      zh-CN: 下次运行
    next_label:
      en: Starts
      zh-CN: 开始于
    unscheduled:
      en: Not scheduled
      zh-CN: 未安排
    all_paused:
      en: All rules paused
      zh-CN: 规则均已暂停
    no_rules:
      en: No rules yet
      zh-CN: 还没有规则
    no_rules_hint:
      en: Let cleanups run on their own.
      zh-CN: 让清理自动进行。
    create:
      en: Create a rule
      zh-CN: 创建规则
    open_rules:
      en: Rules
      zh-CN: 规则
    last:
      en: Last result
      zh-CN: 最近结果
    last_label:
      en: Outcome
      zh-CN: 结果
    no_runs:
      en: No runs yet
      zh-CN: 尚无运行
    no_runs_hint:
      en: Runs of your rules appear here.
      zh-CN: 规则的运行结果会显示在这里。
    open_activity:
      en: Activity
      zh-CN: 活动
