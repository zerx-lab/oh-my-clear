[package]
name = "dial-ghostty"
description = "Safe wrapper over libghostty-vt (Ghostty's VT emulator, built from third_party/ghostty with zig); the workspace's only unsafe FFI island."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
links = "ghostty-vt"

[lib]
doctest = false # cargo-nextest is the only runner (ADR 0006)

[dependencies]
thiserror.workspace = true

# ---- Lints -----------------------------------------------------------------------
# This table MUST equal the root [workspace.lints.rust] + [workspace.lints.clippy]
# EXCEPT `unsafe_code`, which is "deny" here instead of "forbid" so the FFI modules
# can opt in with a narrow `#[expect(unsafe_code, reason = "...")]`. Cargo cannot mix
# `workspace = true` with overrides, hence the copy. An xtask check enforces equality.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
meta_variable_misuse = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unexpected_cfgs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# No-panic policy (docs/memory/decisions/0003-no-panic-policy.md)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
fallible_impl_from = "deny"
arithmetic_side_effects = "deny"
unchecked_time_subtraction = "deny"
exit = "deny"
mem_forget = "deny"
missing_assert_message = "deny"
manual_assert = "deny"

# Suppression only via #[expect(lint, reason = "...")]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Hygiene
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
large_futures = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
rc_buffer = "warn"
infinite_loop = "deny"
tests_outside_test_module = "deny"

# Deliberately silenced pedantic/cargo noise
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
multiple_crate_versions = "allow" # gpui brings many duplicates; cargo-deny reports them
cargo_common_metadata = "allow"   # publish = false app
