[package]
name = "omc-ipc"
description = "UI<->daemon IPC: Unix socket / named pipe transport, length-prefixed JSON control frames, handshake, auth token, endpoint discovery, daemon auto-spawn."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false # cargo-nextest is the only runner (ADR 0006)

[dependencies]
omc-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
