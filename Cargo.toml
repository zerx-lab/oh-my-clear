# Virtual workspace (ADR 0007). Members are picked up by glob: add a library with
# `cargo xtask new-crate <area> "<purpose>"`; binaries live in apps/.
[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "xtask"]
# Bare `cargo run` / `cargo build` target the app; gates always pass --workspace.
default-members = ["apps/oh-my-clear"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "AGPL-3.0-only"

# Every dependency lives here first and passes the gate in `skill://dep-review`
# (ledger: docs/memory/deps.md). Members reference it with `name.workspace = true`.
# Internal crates are added here (path = "crates/omc-x") once another member uses them.
[workspace.dependencies]
omc-apps = { path = "crates/omc-apps" }
omc-engine = { path = "crates/omc-engine" }
omc-ipc = { path = "crates/omc-ipc" }
omc-proto = { path = "crates/omc-proto" }
omc-scan = { path = "crates/omc-scan" }
omc-telemetry = { path = "crates/omc-telemetry" }
omc-ui = { path = "crates/omc-ui" }
embed-resource = "3.0.11"
gpui-kit = "=0.7.0"
# PNG decoding for the X11 window icon (`WindowOptions::icon` is an `image::RgbaImage`).
image = { version = "0.25.10", default-features = false, features = ["png"] }
# SIMD substring search (omc-apps: config-path evidence in app executables; reused from the gpui graph).
memchr = "2.8.3"
# Locks without poisoning (reused from the gpui graph).
parking_lot = "0.12.5"
# macOS Info.plist / launchd plist parsing (omc-apps, macOS only).
plist = { version = "1.10.1", default-features = false, features = ["serde"] }
# Data-parallel filesystem walking (reused from the gpui graph).
rayon = "1.12.0"
rust-i18n = "4.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sys-locale = "0.3"
# Main-thread event loop that hosts the tray on macOS and Windows (daemon only, ADR 0020).
tao = { version = "0.37.1", default-features = false }
thiserror = "2.0.21"
# Members enable only the features they use.
tokio = "1.53.1"
# Settings file of the daemon.
toml = "1.1.6"
# Move to Trash / Recycle Bin (omc-scan).
trash = { version = "5.2.9", default-features = false, features = ["coinit_multithreaded"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# System tray (daemon only, ADR 0020). Linux uses the pure-Rust StatusNotifierItem (D-Bus)
# backend: no GTK, no libappindicator, no event loop.
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"] }
# XXH3-128 content hashes for duplicate detection (omc-scan).
twox-hash = { version = "2.1.4", default-features = false, features = ["xxhash3_128", "std"] }
uuid = { version = "1.26.1", features = ["v4"] }
# Registry access (omc-apps, Windows only; reused from the gpui graph).
windows-registry = "0.6.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
meta_variable_misuse = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unexpected_cfgs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# No-panic policy (docs/memory/decisions/0003-no-panic-policy.md)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
fallible_impl_from = "deny"
arithmetic_side_effects = "deny"
unchecked_time_subtraction = "deny"
exit = "deny"
mem_forget = "deny"
missing_assert_message = "deny"
manual_assert = "deny"

# Suppression only via #[expect(lint, reason = "...")]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Hygiene
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
large_futures = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
rc_buffer = "warn"
infinite_loop = "deny"
tests_outside_test_module = "deny"

# Deliberately silenced pedantic/cargo noise
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
multiple_crate_versions = "allow" # gpui brings many duplicates; cargo-deny reports them
cargo_common_metadata = "allow"   # publish = false app

# ---- Profiles (ADR 0007) -------------------------------------------------------
# dev: workspace crates get full debuginfo for stepping; dependencies keep only line
# tables (usable backtraces, much smaller/faster links). Step into a dependency by
# overriding: CARGO_PROFILE_DEV_PACKAGE_<NAME>_DEBUG=full (or edit locally).
[profile.dev]
debug = "full"

[profile.dev.package."*"]
debug = "line-tables-only"

# gpui-kit's installation guide (ADR 0002): the renderer, text shaping and layout are
# unusably slow unoptimised. Cargo merges these on top of the "*" entry above.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

# Build scripts and proc-macros run on every build; optimise them.
[profile.dev.build-override]
opt-level = 3

# Line tables go to a side file (.dSYM / .dwp / .pdb): the shipped binary stays as small
# as with `debug = false`, and panic backtraces still resolve file:line when the side
# file sits next to the binary (measured 2026-09-28; without `split-debuginfo`,
# `strip = "debuginfo"` silently discarded the line tables).
[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "debuginfo"

# Release speed + full symbols for profilers (Instruments, samply, perf, WPA):
# cargo build --profile profiling -p oh-my-clear
[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"
